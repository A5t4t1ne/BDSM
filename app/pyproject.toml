[project]
name = "BDSM"
version = "0.2.0"
description = "Browser DSA stat Manager. Helps keeping track of your DSA character while playing."
authors = [
    {name = "A5t4t1ne", email = "dev.bdsm@pm.me"},
]
dependencies = [
    "Flask>=3.1.2",
    "Flask-Login>=0.6.3",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.2.2",
    "wtforms>=3.2.1",
    "gunicorn>=23.0.0",
    "pyyaml>=6.0.2",
    "loguru>=0.7.3",
    "pydantic>=2.13.4",
    "flask-limiter>=3.11.0",
    "flask-migrate>=4.1.0",
]
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]


[project.urls]
"Homepage" = "https://github.com/Jave01/BDSM"
"Bug Tracker" = "https://github.com/Jave01/BDSM/issues"


[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.13.1",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    # Alembic scaffolding and autogenerated revisions keep their own style
    "src/migrations",
]


[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I", "B"]


[tool.ruff.format]
line-ending = "auto"
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = false


[tool.uv]
# the application is deployed by copying src/ into the image, not by
# installing it as a package; uv only needs to resolve the dependencies
package = false


[tool.pytest.ini_options]
addopts = "-ra -v"
minversion = 7.0
pythonpath = ["src"]
testpaths = ["test"]
