# Security headers sent on every response.
# 'always' so they are also sent on 4xx/5xx responses.
# Strict-Transport-Security is deliberately NOT here: it is per-host and
# ignores the port, so sending it from a local test server would make the
# browser force HTTPS on every other localhost port too.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "same-origin" always;
add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
