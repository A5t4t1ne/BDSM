# Shared proxy configuration for the Flask app.
location / {
    # Resolve the upstream per request via Docker's embedded DNS. With a
    # literal name nginx resolves once at startup, so recreating the app
    # container (a redeploy) left nginx proxying to a dead address until it
    # was restarted too. The variable form re-resolves and keeps the request
    # URI unchanged.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream http://flask-app:8000;
    proxy_pass $upstream;
    # $http_host keeps the port the browser actually used. With $host (which
    # strips it) Flask-WTF's HTTPS referrer check compared https://localhost/
    # against a referrer of https://localhost:4443/... and rejected every POST
    # as a CSRF failure on any non-standard port.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /robots.txt {
    return 200 "User-agent: *\nDisallow: /\n";
}

location /static/ {
    alias /usr/share/nginx/html/static/;
    expires 7d;
    access_log off;
}
