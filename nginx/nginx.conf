user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # must be >= the app's MAX_CONTENT_LENGTH (16 MB), otherwise nginx rejects
    # uploads with its own 413 before Flask ever sees them
    client_max_body_size 16m;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # --- Local testing ------------------------------------------------------
    # http://localhost:8080 is served directly. It must not redirect to HTTPS:
    # the certificate only covers the public domain, and an HSTS pin picked up
    # from a local HTTPS test would then force every localhost port to HTTPS.
    server {
        listen 80;
        server_name localhost 127.0.0.1;

        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/proxy.conf;
    }

    # https://localhost:4443 works too, with whatever certificate is mounted,
    # but sends no HSTS so it cannot poison plain-HTTP testing.
    server {
        listen 443 ssl;
        http2 on;
        server_name localhost 127.0.0.1;

        ssl_certificate /etc/letsencrypt/live/hans.li/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/hans.li/privkey.pem;

        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/proxy.conf;
    }

    # --- Public site --------------------------------------------------------
    # default_server, so a request for any other name is redirected to HTTPS
    # rather than being served in the clear.
    server {
        listen 80 default_server;
        server_name bdsm.hans.li;

        # ACME renewal must stay reachable over plain HTTP
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl default_server;
        http2 on;
        server_name bdsm.hans.li;

        ssl_certificate /etc/letsencrypt/live/hans.li/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/hans.li/privkey.pem;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/proxy.conf;
    }
}
