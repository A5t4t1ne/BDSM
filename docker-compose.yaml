services:
  flask-app:
    build: ./app
    restart: unless-stopped
    volumes:
      - sqlite_data:/data
      - static_volume:/app/website/static
      - heroes_volume:/app/heroes
    networks:
      - app-network
    secrets:
      - access_code
      - secret_key
      - admin_pw
    environment:
      - PYTHONUNBUFFERED=1
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    build: ./nginx
    restart: unless-stopped
    ports:
      - "8080:80"
      - "4443:443"
    volumes:
      - static_volume:/usr/share/nginx/html/static:ro
      # Certificates stay on the host so they can be renewed without a rebuild
      # and never end up inside an image layer.
      - ./nginx/letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot
    depends_on:
      - flask-app
    networks:
      - app-network
    security_opt:
      - no-new-privileges:true

volumes:
  sqlite_data:
  static_volume:
  heroes_volume:
  certbot_webroot:

networks:
  app-network:
    driver: bridge

secrets:
    access_code:
      file: ./app/secrets/access_code.txt
    secret_key:
      file: ./app/secrets/secret_key.txt
    admin_pw:
      file: ./app/secrets/admin_pw.txt
